<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Last Roast{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="border-bottom border-ink">
    <nav class="container py-3 d-flex align-items-center justify-content-between flex-wrap gap-3">
      <a href="{{ url_for('index') }}" class="brand text-decoration-none">LAST ROAST</a>
      <div class="d-flex align-items-center gap-4 mono text-uppercase">
        <a href="{{ url_for('products') }}" class="link-ink">Shop</a>
        <a href="{{ url_for('cart') }}" class="btn btn-box btn-white">Cart ({{ cart_count }})</a>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    {% for msg in get_flashed_messages() %}<div class="box p-3 mb-4 mono" role="status">{{ msg }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-ink text-cream">
    <div class="container py-4 d-flex justify-content-between flex-wrap gap-3 mono text-uppercase small">
      <span class="brand fs-3">LAST ROAST</span>
      <span>© 2026 · Payments secured by Stripe</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
