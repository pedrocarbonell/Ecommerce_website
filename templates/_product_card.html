<a href="{{ url_for('product_detail', slug=slug) }}" class="box box-hover d-flex flex-column h-100 text-decoration-none text-ink">
  <div class="product-art border-bottom border-ink" style="background: {{ p.color }}">
    <div class="bag"><span class="display-font fs-3">{{ p.name }}</span><span class="mono small">12 OZ</span></div>
  </div>
  <div class="p-3">
    <div class="mono small text-uppercase text-muted-ink">{{ p.roast }}</div>
    <div class="d-flex justify-content-between align-items-baseline gap-2">
      <span class="display-font fs-2">{{ p.name }}</span>
      <span class="mono fw-medium">{% if stock.get(slug, 0) <= 0 %}<span class="tag bg-white me-2">Sold out</span>{% endif %}${{ p.price }}</span>
    </div>
    {% if show_notes %}<div class="text-muted-ink">{{ p.notes }}</div>{% endif %}
  </div>
</a>
